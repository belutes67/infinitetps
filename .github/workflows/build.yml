name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: nightly

      - name: Upload the .geode file
        uses: actions/upload-artifact@v4
        with:
          name: infinite-tps
          path: ${{ steps.build.outputs.build-output }}
